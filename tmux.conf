# hexafunk tmux theme. Loaded after tpm, so it overrides tmux-gruvbox while
# hexafunk is the current Omarchy theme. Same angled powerline layout as
# tmux-gruvbox; colors mirror the Neovim statusline: pink-dim session block
# (bright pink while the prefix is held), teal current window, teal-dim
# position/clock block on the right.

set -g status-style "bg=#181915,fg=#d4ccc1"
set -g status-justify left
set -g status-left-style none
set -g status-right-style none
set -g status-left-length 40
set -g status-right-length 80
set -g window-status-separator ""

set -g status-left "#[bg=#{?client_prefix,#ff79bc,#c41a6e},fg=#{?client_prefix,#181915,#f5f1ea},bold] #S #[bg=#181915,fg=#{?client_prefix,#ff79bc,#c41a6e},nobold]"

set -g status-right "#[bg=#181915,fg=#36382e]#[bg=#36382e,fg=#fbc956]#{?pane_in_mode, COPY,}#[fg=#ff79bc]#{?client_prefix, PREFIX,}#[fg=#fa984c]#{?window_zoomed_flag, ZOOM,}#[fg=#d4ccc1] %Y-%m-%d #[bg=#36382e,fg=#19c9b0]#[bg=#19c9b0,fg=#181915,bold] %H:%M #[bg=#19c9b0,fg=#00f0d0,nobold]#[bg=#00f0d0,fg=#181915,bold] #h "

set -g window-status-format "#[bg=#36382e,fg=#181915]#[bg=#36382e,fg=#8e927c] #I #[fg=#d4ccc1]#W#{?window_zoomed_flag, Z,} #[bg=#181915,fg=#36382e]"
set -g window-status-current-format "#[bg=#00f0d0,fg=#181915]#[bg=#00f0d0,fg=#181915] #I #[bold]#W#{?window_zoomed_flag, Z,} #[bg=#181915,fg=#00f0d0,nobold]"
set -g window-status-activity-style "fg=#fbc956"
set -g window-status-bell-style "fg=#ff7370,bold"

set -g pane-border-style "fg=#494b3f"
set -g pane-active-border-style "fg=#ff79bc"
set -g display-panes-colour "#8e927c"
set -g display-panes-active-colour "#00f0d0"

set -g message-style "bg=#36382e,fg=#f5f1ea"
set -g message-command-style "bg=#36382e,fg=#00f0d0"
set -g mode-style "bg=#c41a6e,fg=#f5f1ea"
set -g copy-mode-match-style "bg=#d6a22e,fg=#181915"
set -g copy-mode-current-match-style "bg=#00f0d0,fg=#181915"
setw -g clock-mode-colour "#ff79bc"
set -g popup-border-style "fg=#ff79bc"
set -g menu-border-style "fg=#ff79bc"
